<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 2</title>
</head>
<body>
    <script>
    var numero1 = prompt("Digite o primeiro número: ");
    var numero2 = prompt("Digite o segundo número: ");

    var soma = parseFloat(numero1) + parseFloat(numero2);
    alert("A soma dos números é: " + soma);
    var subtracao = parseFloat(numero1) - parseFloat(numero2);
    alert("A subtração dos números é: " + subtracao);
    var multiplicacao = parseFloat(numero1) * parseFloat(numero2);
    alert("A multiplicação dos números é: " + multiplicacao);
    var divisao = parseFloat(numero1) / parseFloat(numero2);
    alert("A divisão dos números é: " + divisao);
    var resto = parseFloat(numero1) % parseFloat(numero2);
    alert("O resto da divisão dos números é: " + resto);
</script>
</body>
</html>
