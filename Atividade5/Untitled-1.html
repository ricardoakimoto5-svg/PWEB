<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Breakpoints com Media Queries</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        .caixa {
            width: 500px;
            height: 500px;
            background-color: gray;

            display: flex;
            justify-content: center;
            align-items: center;

            text-align: center;
        }

        .caixa h2 {
            color: white;
            font-size: 32px;
        }

        /* Até 420px */
        @media (max-width: 420px) {
            .caixa {
                background-color: gray;
            }

            .caixa h2::after {
                content: "Cinza";
            }
        }

        /* De 421px até 768px */
        @media (min-width: 421px) and (max-width: 768px) {
            .caixa {
                background-color: orange;
            }

            .caixa h2::after {
                content: "Laranja";
            }
        }

        /* De 769px até 1024px */
        @media (min-width: 769px) and (max-width: 1024px) {
            .caixa {
                background-color: blue;
            }

            .caixa h2::after {
                content: "Azul";
            }
        }

        /* De 1025px até 1920px */
        @media (min-width: 1025px) and (max-width: 1920px) {
            .caixa {
                background-color: red;
            }

            .caixa h2::after {
                content: "Vermelho";
            }
        }

        /* Acima de 1920px */
        @media (min-width: 1921px) {
            .caixa {
                background-color: green;
            }

            .caixa h2::after {
                content: "Verde";
            }
        }
    </style>
</head>

<body>

    <div class="caixa">
        <h2></h2>
    </div>

</body>
</html>
